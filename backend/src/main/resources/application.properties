spring.application.name=success-farms-api
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/success_farms}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:success_farms}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:farms_dev_password}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
